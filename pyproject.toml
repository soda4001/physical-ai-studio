[project]
name = "physical-ai-studio"
version = "0.1.0"
description = "Easy Physical AI Studio & Developer IDE for Beginners"
authors = [{ name = "Physical AI Developer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pywebview>=4.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
mujoco = [
    "mujoco>=3.1.0",
    "onnxruntime>=1.17.0",
]
